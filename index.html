<!DOCTYPE html>
<html lang="PT-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Jokenpô -Jogo de Pedra, Papel e Tesoura</title>
    </head>

    <body>
        <div class="container">
            <h1>Projeto Jokenpô</h1>
            <div id="botoes">
                <button id="pedra" onclick="playHuman('pedra')">&#x1F44A;</button>
                <button id="papel" onclick="playHuman('papel')">&#x1F590;</button>
                <button id="tesoura" onclick="playHuman('tesoura')">&#x270C;</button>
            </div>

            <p class="resultado"></p>
            
            <p class="suaPontuacao">Sua pontuação: <span id="human-score">0</span></p>
            <p class="pontuacaoAlexa">Pontuação da Alexa: <span id="machine-score">0</span></p>
        </div>

        <script src="script.js"></script>

    </body>

</html>
